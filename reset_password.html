<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — D-Swift Mall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:#e9ebee; font-family:'Segoe UI',Arial,sans-serif;
        }
        .card {
            background:#fff; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.1);
            width:90%; max-width:440px; overflow:hidden;
        }
        .top {
            background:linear-gradient(135deg,#1325e8,#8f10b7);
            padding:36px 28px; text-align:center; color:#fff;
        }
        .top i { font-size:48px; opacity:.9; }
        .top h1 { font-size:22px; margin-top:12px; }
        .top p  { font-size:13px; opacity:.8; margin-top:6px; }
        .body { padding:32px 28px; }
        .field { margin-bottom:16px; position:relative; }
        .field label { display:block; font-size:13px; color:#555; margin-bottom:6px; font-weight:600; }
        .field input {
            width:100%; padding:13px 44px 13px 14px;
            border:2px solid #e0e0e0; border-radius:10px;
            font-size:15px; outline:none; transition:.2s; font-family:inherit;
        }
        .field input:focus { border-color:#8f10b7; }
        .field .eye {
            position:absolute; right:13px; top:38px; cursor:pointer; color:#aaa; font-size:15px;
        }
        .strength-bar { height:4px; border-radius:2px; margin-top:6px; background:#eee; overflow:hidden; }
        .strength-fill { height:100%; width:0; transition:.3s; border-radius:2px; }
        .strength-label { font-size:11px; color:#aaa; margin-top:3px; }
        .btn {
            width:100%; padding:14px; border:none; border-radius:40px;
            background:linear-gradient(135deg,#1325e8,#8f10b7);
            color:#fff; font-size:16px; font-weight:700; cursor:pointer;
            margin-top:8px; letter-spacing:.5px; transition:.2s;
        }
        .btn:hover { opacity:.9; }
        .btn:disabled { opacity:.6; cursor:not-allowed; }
        .msg {
            margin-top:14px; padding:12px 16px; border-radius:10px;
            font-size:14px; text-align:center; display:none;
        }
        .msg.success { background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; }
        .msg.error   { background:#fce4ec; color:#c62828; border:1px solid #ef9a9a; }
        .back { display:block; text-align:center; margin-top:18px; font-size:13px; color:#888; }
        .back a { color:#8f10b7; font-weight:600; text-decoration:none; }
        .footer { text-align:center; padding:14px; font-size:12px; color:#bbb; border-top:1px solid #f0f0f0; }

        /* Expired / invalid token state */
        .invalid-state { padding:32px 28px; text-align:center; }
        .invalid-state i { font-size:48px; color:#e74c3c; }
        .invalid-state h2 { color:#333; margin:14px 0 8px; }
        .invalid-state p { color:#888; font-size:14px; line-height:1.6; }
        .invalid-state a.btn { display:inline-block; margin-top:20px; text-decoration:none;
            padding:12px 30px; width:auto; font-size:14px; border-radius:40px; }
    </style>
</head>
<body>
<div class="card" id="mainCard">
    <div class="top">
        <i class="fas fa-lock-open"></i>
        <h1>Reset Your Password</h1>
        <p>Choose a strong new password below</p>
    </div>
    <div class="body" id="formArea">
        <div class="field">
            <label>New Password</label>
            <input type="password" id="newPass" placeholder="At least 6 characters">
            <i class="fas fa-eye eye" onclick="toggleEye('newPass',this)"></i>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-label" id="strengthLabel"></div>
        </div>
        <div class="field">
            <label>Confirm Password</label>
            <input type="password" id="confirmPass" placeholder="Repeat your new password">
            <i class="fas fa-eye eye" onclick="toggleEye('confirmPass',this)"></i>
        </div>
        <button class="btn" id="resetBtn" onclick="doReset()">
            <i class="fas fa-key"></i> Set New Password
        </button>
        <div class="msg" id="msg"></div>
        <span class="back">Remember it? <a href="login.html">Back to Login</a></span>
    </div>
    <div class="footer">© 2027 D-Swift Mall</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
// Supabase's resetPasswordForEmail() (called from loginscript.js) sends a
// link that, when opened, has Supabase's client automatically parse a
// recovery token out of the URL and create a short-lived authenticated
// session — no manual ?token= handling needed (that was the old PHP
// endpoint's approach). We just wait for that PASSWORD_RECOVERY event,
// then let the user set a new password via sb.auth.updateUser().
let recoveryReady = false;

sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) recoveryReady = true;
});

// Fallback: if the event already fired before this listener attached
// (can happen depending on load timing), check for an existing session too.
(async () => {
    await new Promise(r => setTimeout(r, 400)); // give onAuthStateChange a moment to fire first
    if (recoveryReady) return;
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
        showInvalid('Invalid or Expired Link', 'This password reset link is invalid or has expired. Please request a new one.');
    }
})();

function toggleEye(inputId, icon) {
    const input = document.getElementById(inputId);
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    icon.className = isPass ? 'fas fa-eye-slash eye' : 'fas fa-eye eye';
}

// Password strength meter
document.getElementById('newPass').addEventListener('input', function() {
    const val   = this.value;
    const fill  = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
        { w:'0%',   color:'#eee',    text:'' },
        { w:'25%',  color:'#e74c3c', text:'Weak' },
        { w:'50%',  color:'#f39c12', text:'Fair' },
        { w:'75%',  color:'#3498db', text:'Good' },
        { w:'100%', color:'#2ecc71', text:'Strong' },
    ];
    const lvl = levels[Math.min(score, 4)];
    fill.style.width       = lvl.w;
    fill.style.background  = lvl.color;
    label.textContent      = lvl.text;
    label.style.color      = lvl.color;
});

async function doReset() {
    const pass    = document.getElementById('newPass').value;
    const confirm = document.getElementById('confirmPass').value;
    const btn     = document.getElementById('resetBtn');
    const msg     = document.getElementById('msg');

    msg.style.display = 'none';

    if (!pass || pass.length < 6) { showMsg('error', 'Password must be at least 6 characters.'); return; }
    if (pass !== confirm)          { showMsg('error', 'Passwords do not match.'); return; }

    btn.disabled     = true;
    btn.innerHTML    = '<i class="fas fa-spinner fa-spin"></i> Resetting…';

    try {
        const { error } = await sb.auth.updateUser({ password: pass });

        if (!error) {
            showMsg('success', '✅ Password reset successful! You can now log in with your new password.');
            btn.style.display = 'none';
            await sb.auth.signOut(); // recovery session shouldn't stay logged in
            setTimeout(() => window.location.href = 'login.html', 2500);
        } else {
            showMsg('error', error.message || 'Reset failed. Please try again.');
            btn.disabled  = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Set New Password';
        }
    } catch (err) {
        showMsg('error', 'Network error. Please try again.');
        btn.disabled  = false;
        btn.innerHTML = '<i class="fas fa-key"></i> Set New Password';
    }
}

function showMsg(type, text) {
    const el = document.getElementById('msg');
    el.className      = 'msg ' + type;
    el.textContent    = text;
    el.style.display  = 'block';
}

function showInvalid(title, text) {
    document.getElementById('formArea').outerHTML = `
        <div class="invalid-state">
            <i class="fas fa-exclamation-circle"></i>
            <h2>${title}</h2>
            <p>${text}</p>
            <a class="btn" href="login.html">Back to Login</a>
        </div>`;
}
</script>
</body>
</html>
