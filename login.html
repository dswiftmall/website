<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>D-Swift Mall — Login &amp; Sign Up</title>
    <link rel="icon" type="image" href="favicon-round.png">
    <link rel="stylesheet" href="loginstyle.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<div class="dswift-card" id="authCard">

    <div class="dswift-brand">
        <img src="logo-full-cropped.png" alt="D-Swift Mall" class="dswift-brand-logo">
    </div>

    <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Log in</button>
        <button type="button" class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Sign up</button>
    </div>

    <!-- ══════════════ LOGIN PANEL ══════════════ -->
    <div class="auth-panel active" id="panelLogin">
        <h1 class="auth-title">Log in to D-Swift Mall</h1>
        <p class="auth-subtitle">Welcome back — enter your details below</p>

        <form onsubmit="return false;">
            <input type="email"    id="loginEmail"    placeholder="Email" autocomplete="email"/>
            <input type="password" id="loginPassword" placeholder="Password"/>
            <div class="row-between">
                <label class="remember-label"><input type="checkbox" id="rememberMe"> Remember me</label>
                <span class="forget">Forgot password?</span>
            </div>
            <span id="loginError" class="error-msg"></span>
            <button id="loginBtn" class="primary-btn">Log in</button>
        </form>

        <div class="divider"><span>or continue with</span></div>
        <button type="button" class="google-btn social-icon" data-provider="Google">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            <span>Continue with Google</span>
        </button>

        <div class="mob-switch-row">Don't have an account? <span onclick="switchTab('signup')">Sign up</span></div>
        <div class="back-link"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></div>
    </div>

    <!-- ══════════════ SIGNUP PANEL ══════════════ -->
    <div class="auth-panel" id="panelSignup">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Choose how you'll use your account</p>

        <div class="role-selector">
            <button type="button" class="role-btn selected" id="roleBuyerSignup" onclick="selectRole('buyer')">
                <i class="fas fa-shopping-bag"></i>
                <span>Buyer</span>
            </button>
            <button type="button" class="role-btn" id="roleSellerSignup" onclick="selectRole('seller')">
                <i class="fas fa-store"></i>
                <span>Seller</span>
            </button>
        </div>
        <input type="hidden" id="regRole" value="buyer"/>

        <form onsubmit="return false;">
            <input type="text"     id="regName"     placeholder="Full Name *"/>
            <input type="email"    id="regEmail"    placeholder="Email *"/>
            <input type="password" id="regPassword" placeholder="Password * (min 6 chars)"/>
            <input type="tel"      id="regPhone"    placeholder="Phone Number *"/>
            <span id="regError" class="error-msg"></span>
            <button id="registerBtn" class="primary-btn">Create Account</button>
        </form>

        <div class="divider"><span>or continue with</span></div>
        <button type="button" class="google-btn social-icon" data-provider="Google">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            <span>Continue with Google</span>
        </button>

        <div class="mob-switch-row">Already have an account? <span onclick="switchTab('login')">Log in</span></div>
        <div class="back-link"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a></div>
    </div>

    <span class="copy">&copy; 2027 D-Swift Mall</span>
</div>

<div class="dswift-toast" id="dswiftToast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="loginscript.js"></script>
<script>
    function switchTab(tab) {
        document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
        document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
        document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
        document.getElementById('panelSignup').classList.toggle('active', tab === 'signup');
    }

    function selectRole(role) {
        document.getElementById('regRole').value = role;
        document.getElementById('roleBuyerSignup').classList.toggle('selected', role === 'buyer');
        document.getElementById('roleSellerSignup').classList.toggle('selected', role === 'seller');
    }
</script>
</body>
</html>
